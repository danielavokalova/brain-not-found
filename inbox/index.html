<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quick Notes - Brain Not Found</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --accent: #2563eb;
      --border: #e5e7eb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.2rem;
    }

    textarea {
      width: 100%;
      min-height: 120px;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      font: inherit;
      color: var(--text);
      resize: vertical;
    }

    .actions {
      margin-top: 8px;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 9px 14px;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }

    .notes {
      margin-top: 12px;
      display: grid;
      gap: 8px;
    }

    .note {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px;
      background: #fff;
    }

    .note-text {
      white-space: pre-wrap;
      margin: 0 0 6px;
      line-height: 1.35;
    }

    .note-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .timestamp {
      color: var(--muted);
      font-size: 0.82rem;
    }

    .delete-btn {
      background: #e5e7eb;
      color: #111827;
      padding: 6px 10px;
      font-size: 0.82rem;
    }

    .empty {
      color: var(--muted);
      font-size: 0.9rem;
      border: 1px dashed var(--border);
      border-radius: 8px;
      padding: 10px;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>Quick Notes</h1>

    <textarea id="noteInput" placeholder="Napiš cokoliv..."></textarea>

    <div class="actions">
      <button id="saveBtn" type="button">Uložit</button>
    </div>

    <section id="notesList" class="notes"></section>
  </main>

  <script>
    const STORAGE_KEY = "brain-not-found-quick-notes";
    const noteInput = document.getElementById("noteInput");
    const saveBtn = document.getElementById("saveBtn");
    const notesList = document.getElementById("notesList");

    let notes = [];

    function loadNotes() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) {
        notes = [];
        return;
      }
      try {
        const parsed = JSON.parse(raw);
        notes = Array.isArray(parsed) ? parsed : [];
      } catch (error) {
        notes = [];
      }
    }

    function saveNotes() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
    }

    function formatTimestamp(iso) {
      const date = new Date(iso);
      return date.toLocaleString("cs-CZ");
    }

    function renderNotes() {
      notesList.innerHTML = "";

      if (notes.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "Zatím tu nejsou žádné poznámky.";
        notesList.appendChild(empty);
        return;
      }

      notes.forEach(function (note) {
        const item = document.createElement("article");
        item.className = "note";

        const text = document.createElement("p");
        text.className = "note-text";
        text.textContent = note.text;

        const meta = document.createElement("div");
        meta.className = "note-meta";

        const timestamp = document.createElement("span");
        timestamp.className = "timestamp";
        timestamp.textContent = formatTimestamp(note.createdAt);

        const del = document.createElement("button");
        del.className = "delete-btn";
        del.type = "button";
        del.textContent = "Smazat";
        del.addEventListener("click", function () {
          notes = notes.filter(function (n) {
            return n.id !== note.id;
          });
          saveNotes();
          renderNotes();
        });

        meta.appendChild(timestamp);
        meta.appendChild(del);

        item.appendChild(text);
        item.appendChild(meta);
        notesList.appendChild(item);
      });
    }

    saveBtn.addEventListener("click", function () {
      const text = noteInput.value.trim();
      if (!text) return;

      notes.unshift({
        id: Date.now().toString(),
        text: text,
        createdAt: new Date().toISOString()
      });

      saveNotes();
      noteInput.value = "";
      renderNotes();
      noteInput.focus();
    });

    loadNotes();
    renderNotes();
  </script>
</body>
</html>
