<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Email Generator - Brain Not Found</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --accent: #2563eb;
      --border: #e5e7eb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 980px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.04);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 2rem;
    }

    .sub {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 1.05rem;
    }

    .grid {
      display: grid;
      gap: 12px;
    }

    label {
      display: grid;
      gap: 6px;
      font-size: 1.05rem;
      font-weight: 600;
    }

    select,
    textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      font: inherit;
      color: var(--text);
      background: #fff;
    }

    textarea {
      min-height: 220px;
      resize: vertical;
      font-size: 1.05rem;
      line-height: 1.45;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 4px;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 12px 18px;
      font-weight: 600;
      cursor: pointer;
      font-size: 1rem;
    }

    .primary {
      background: var(--accent);
      color: white;
    }

    .secondary {
      background: #e5e7eb;
      color: #111827;
    }

    .back {
      display: inline-block;
      margin-top: 12px;
      color: var(--accent);
      text-decoration: none;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Email Generator</h1>
    <p class="sub">Write one line and get a ready email in 5 seconds.</p>

    <section class="grid">
      <label for="language">
        Language
        <select id="language">
          <option value="en">EN</option>
          <option value="cz">CZ</option>
        </select>
      </label>

      <label for="idea">
        Co chceš napsat
        <textarea id="idea" placeholder="E.g.: Thank the client for interest and suggest a short call next week."></textarea>
      </label>

      <div class="actions">
        <button class="primary" id="generateBtn" type="button">Vytvořit email</button>
      </div>

      <label for="result">Výsledek
        <textarea id="result" readonly placeholder="Generated email appears here"></textarea>
      </label>

      <div class="actions">
        <button class="secondary" id="copyBtn" type="button">Copy</button>
      </div>
    </section>

    <a class="back" href="../index.html">Zpět na dashboard</a>
  </main>

  <script>
    const languageInput = document.getElementById("language");
    const ideaInput = document.getElementById("idea");
    const resultOutput = document.getElementById("result");
    const generateBtn = document.getElementById("generateBtn");
    const copyBtn = document.getElementById("copyBtn");

    function toSentence(value) {
      const trimmed = value.trim();
      if (!trimmed) return "";
      return /[.!?]$/.test(trimmed) ? trimmed : trimmed + ".";
    }

    function buildEmail() {
      const language = languageInput.value;
      const idea = ideaInput.value.trim();
      if (language === "cz") {
        const shortIdea = idea ? toSentence(idea) : "Děkuji za zprávu a zájem.";
        return [
          "Předmět: Krátká reakce",
          "",
          "Dobrý den,",
          "",
          shortIdea,
          "Ráda navrhnu krátký další krok, který vám bude časově vyhovovat.",
          "Když budete chtít, pošlu hned konkrétní termíny.",
          "",
          "S pozdravem,",
          "Daniela"
        ].join("\n");
      }

      const shortIdea = idea ? toSentence(idea) : "Thank you for your message and interest.";
      return [
        "Subject: Quick follow-up",
        "",
        "Hello,",
        "",
        shortIdea,
        "I would be happy to suggest a short next step that fits your schedule.",
        "If useful, I can send available time slots right away.",
        "",
        "Best regards,",
        "Daniela"
      ].join("\n");
    }

    generateBtn.addEventListener("click", function () {
      resultOutput.value = buildEmail();
    });

    copyBtn.addEventListener("click", async function () {
      if (!resultOutput.value.trim()) return;
      try {
        await navigator.clipboard.writeText(resultOutput.value);
        copyBtn.textContent = "Copied";
        setTimeout(function () {
          copyBtn.textContent = "Copy";
        }, 1200);
      } catch (error) {
        copyBtn.textContent = "Copy failed";
        setTimeout(function () {
          copyBtn.textContent = "Copy";
        }, 1500);
      }
    });
  </script>
</body>
</html>
