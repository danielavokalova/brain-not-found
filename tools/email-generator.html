<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Email Generator - Brain Not Found</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --accent: #2563eb;
      --border: #e5e7eb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 980px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.04);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 2rem;
    }

    .sub {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 1.05rem;
    }

    .grid {
      display: grid;
      gap: 12px;
    }

    .grid.two-col {
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      align-items: start;
    }

    @media (max-width: 900px) {
      .grid.two-col {
        grid-template-columns: 1fr;
      }
    }

    label {
      display: grid;
      gap: 6px;
      font-size: 1.05rem;
      font-weight: 600;
    }

    select,
    input,
    textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      font: inherit;
      color: var(--text);
      background: #fff;
    }

    textarea {
      min-height: 220px;
      resize: vertical;
      font-size: 1.05rem;
      line-height: 1.45;
    }

    .small-textarea {
      min-height: 120px;
    }

    .panel {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      background: #fcfdff;
    }

    .panel h2 {
      margin: 0 0 10px;
      font-size: 1.15rem;
    }

    .muted {
      color: var(--muted);
      font-size: 0.95rem;
      margin: 0 0 10px;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 4px;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 12px 18px;
      font-weight: 600;
      cursor: pointer;
      font-size: 1rem;
    }

    .primary {
      background: var(--accent);
      color: white;
    }

    .secondary {
      background: #e5e7eb;
      color: #111827;
    }

    .ghost {
      background: #f3f4f6;
      color: #111827;
    }

    .back {
      display: inline-block;
      margin-top: 12px;
      color: var(--accent);
      text-decoration: none;
      font-size: 0.9rem;
    }

    .template-list {
      display: grid;
      gap: 10px;
      margin-top: 10px;
    }

    .template-item {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      background: #fff;
    }

    .template-title {
      font-weight: 700;
      margin: 0 0 4px;
    }

    .template-meta {
      font-size: 0.9rem;
      color: var(--muted);
      margin: 0 0 8px;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Email Generator</h1>
    <p class="sub">Write one line and get a ready email in 5 seconds.</p>

    <section class="grid two-col">
      <div class="panel">
        <h2>Rychlé vytvoření e-mailu</h2>
        <p class="muted">Vyber jazyk, napiš zadání nebo použij uloženou šablonu.</p>

        <section class="grid">
          <label for="language">
            Language
            <select id="language">
              <option value="en">EN</option>
              <option value="cz">CZ</option>
            </select>
          </label>

          <label for="idea">
            Co chceš napsat
            <textarea id="idea" placeholder="E.g.: Thank the client for interest and suggest a short call next week."></textarea>
          </label>

          <div class="actions">
            <button class="primary" id="generateBtn" type="button">Vytvořit email</button>
            <button class="ghost" id="useTemplateBtn" type="button">Použít vybranou šablonu</button>
          </div>

          <label for="result">Výsledek
            <textarea id="result" readonly placeholder="Generated email appears here"></textarea>
          </label>

          <div class="actions">
            <button class="secondary" id="copyBtn" type="button">Copy</button>
          </div>
        </section>
      </div>

      <div class="panel">
        <h2>Správa šablon</h2>
        <p class="muted">Nastav si vlastní šablony a pak je vytáhni jedním klikem.</p>

        <section class="grid">
          <label for="templateProduct">
            Produkt
            <input id="templateProduct" placeholder="Např. AI konzultace" />
          </label>

          <label for="templatePurpose">
            Účel
            <input id="templatePurpose" placeholder="Např. Follow-up po callu" />
          </label>

          <label for="templateSubject">
            Subject
            <input id="templateSubject" placeholder="Např. Quick follow-up after our call" />
          </label>

          <label for="templateBody">
            Tělo e-mailu
            <textarea id="templateBody" class="small-textarea" placeholder="Sem napiš základ šablony e-mailu..."></textarea>
          </label>

          <div class="actions">
            <button class="primary" id="saveTemplateBtn" type="button">Uložit šablonu</button>
          </div>

          <label for="templateSelect">
            Vyber šablonu
            <select id="templateSelect"></select>
          </label>
        </section>

        <div id="templateList" class="template-list"></div>
      </div>
    </section>

    <a class="back" href="../index.html">Zpět na dashboard</a>
  </main>

  <script>
    const STORAGE_KEY = "brain-not-found-email-templates";

    const languageInput = document.getElementById("language");
    const ideaInput = document.getElementById("idea");
    const resultOutput = document.getElementById("result");
    const generateBtn = document.getElementById("generateBtn");
    const useTemplateBtn = document.getElementById("useTemplateBtn");
    const copyBtn = document.getElementById("copyBtn");
    const templateProductInput = document.getElementById("templateProduct");
    const templatePurposeInput = document.getElementById("templatePurpose");
    const templateSubjectInput = document.getElementById("templateSubject");
    const templateBodyInput = document.getElementById("templateBody");
    const saveTemplateBtn = document.getElementById("saveTemplateBtn");
    const templateSelect = document.getElementById("templateSelect");
    const templateList = document.getElementById("templateList");

    let templates = [];

    function toSentence(value) {
      const trimmed = value.trim();
      if (!trimmed) return "";
      return /[.!?]$/.test(trimmed) ? trimmed : trimmed + ".";
    }

    function getDefaultTemplates() {
      return [
        {
          id: Date.now().toString() + "-1",
          product: "Service",
          purpose: "Reply to interest",
          subject: "Thanks for your interest",
          body: "Thank you for your interest. I would be happy to suggest the next step that fits your timeline."
        },
        {
          id: Date.now().toString() + "-2",
          product: "Služba",
          purpose: "Připomenutí",
          subject: "Krátké připomenutí",
          body: "Jen navazuji na předchozí zprávu. Pokud je to stále aktuální, ráda navrhnu další postup."
        }
      ];
    }

    function loadTemplates() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) {
        templates = getDefaultTemplates();
        saveTemplates();
        return;
      }
      try {
        const parsed = JSON.parse(raw);
        templates = Array.isArray(parsed) ? parsed : getDefaultTemplates();
      } catch (error) {
        templates = getDefaultTemplates();
      }
    }

    function saveTemplates() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(templates));
    }

    function renderTemplateSelect() {
      templateSelect.innerHTML = "";
      templates.forEach(function (tpl) {
        const option = document.createElement("option");
        option.value = tpl.id;
        option.textContent = `${tpl.product} - ${tpl.purpose}`;
        templateSelect.appendChild(option);
      });
      if (templates.length === 0) {
        const option = document.createElement("option");
        option.value = "";
        option.textContent = "Žádná šablona";
        templateSelect.appendChild(option);
      }
    }

    function removeTemplate(id) {
      templates = templates.filter(function (tpl) {
        return tpl.id !== id;
      });
      saveTemplates();
      renderTemplates();
    }

    function renderTemplates() {
      renderTemplateSelect();
      templateList.innerHTML = "";

      templates.forEach(function (tpl) {
        const item = document.createElement("div");
        item.className = "template-item";

        const title = document.createElement("p");
        title.className = "template-title";
        title.textContent = tpl.subject || `${tpl.product} - ${tpl.purpose}`;

        const meta = document.createElement("p");
        meta.className = "template-meta";
        meta.textContent = `${tpl.product} | ${tpl.purpose}`;

        const actions = document.createElement("div");
        actions.className = "actions";

        const useBtn = document.createElement("button");
        useBtn.className = "ghost";
        useBtn.type = "button";
        useBtn.textContent = "Použít";
        useBtn.addEventListener("click", function () {
          templateSelect.value = tpl.id;
          applySelectedTemplate();
        });

        const deleteBtn = document.createElement("button");
        deleteBtn.className = "secondary";
        deleteBtn.type = "button";
        deleteBtn.textContent = "Smazat";
        deleteBtn.addEventListener("click", function () {
          removeTemplate(tpl.id);
        });

        actions.appendChild(useBtn);
        actions.appendChild(deleteBtn);
        item.appendChild(title);
        item.appendChild(meta);
        item.appendChild(actions);
        templateList.appendChild(item);
      });
    }

    function applySelectedTemplate() {
      const selectedId = templateSelect.value;
      const selected = templates.find(function (tpl) {
        return tpl.id === selectedId;
      });
      if (!selected) {
        return;
      }
      ideaInput.value = `${selected.subject} - ${selected.body}`;
    }

    function buildEmail() {
      const language = languageInput.value;
      const idea = ideaInput.value.trim();
      if (language === "cz") {
        const shortIdea = idea ? toSentence(idea) : "Děkuji za zprávu a zájem.";
        return [
          "Předmět: Krátká reakce",
          "",
          "Dobrý den,",
          "",
          shortIdea,
          "Ráda navrhnu krátký další krok, který vám bude časově vyhovovat.",
          "Když budete chtít, pošlu hned konkrétní termíny.",
          "",
          "S pozdravem,",
          "Daniela"
        ].join("\n");
      }

      const shortIdea = idea ? toSentence(idea) : "Thank you for your message and interest.";
      return [
        "Subject: Quick follow-up",
        "",
        "Hello,",
        "",
        shortIdea,
        "I would be happy to suggest a short next step that fits your schedule.",
        "If useful, I can send available time slots right away.",
        "",
        "Best regards,",
        "Daniela"
      ].join("\n");
    }

    saveTemplateBtn.addEventListener("click", function () {
      const product = templateProductInput.value.trim();
      const purpose = templatePurposeInput.value.trim();
      const subject = templateSubjectInput.value.trim();
      const body = templateBodyInput.value.trim();

      if (!product || !purpose || !subject || !body) {
        alert("Vyplň prosím produkt, účel, subject i tělo e-mailu.");
        return;
      }

      templates.unshift({
        id: Date.now().toString(),
        product: product,
        purpose: purpose,
        subject: subject,
        body: body
      });

      saveTemplates();
      renderTemplates();

      templateProductInput.value = "";
      templatePurposeInput.value = "";
      templateSubjectInput.value = "";
      templateBodyInput.value = "";
    });

    useTemplateBtn.addEventListener("click", function () {
      applySelectedTemplate();
    });

    generateBtn.addEventListener("click", function () {
      resultOutput.value = buildEmail();
    });

    copyBtn.addEventListener("click", async function () {
      if (!resultOutput.value.trim()) return;
      try {
        await navigator.clipboard.writeText(resultOutput.value);
        copyBtn.textContent = "Copied";
        setTimeout(function () {
          copyBtn.textContent = "Copy";
        }, 1200);
      } catch (error) {
        copyBtn.textContent = "Copy failed";
        setTimeout(function () {
          copyBtn.textContent = "Copy";
        }, 1500);
      }
    });

    loadTemplates();
    renderTemplates();
  </script>
</body>
</html>
